name: 自动更新 CyberLink 版本号

on:
  schedule:
    # 每 2 小时跑一次（UTC 偶数小时 → 北京时间 08~06 点整点）
    # 原来每天只跑一次（UTC 0:00），零售版发布后最长要等 24 小时才更新，
    # 加上版本号靠 version_display 写死，页面就长期停在旧版。
    - cron: '0 */2 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装 7z
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: 运行版本抓取脚本
        run: python fetch_versions.py

      - name: 检查是否有变更
        id: check
        run: |
          git diff --exit-code data.json index.html && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 提交并推送更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          git commit -m "自动更新版本号 $(date -u +%Y-%m-%d)"
          git push
